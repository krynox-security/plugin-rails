name: Release

# Publishes the gem to RubyGems on a version tag. Dormant until tagged. Requires RUBYGEMS_API_KEY.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-rubygems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Build + push gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          gem build *.gemspec
          gem push *.gem
